[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sports-card-agent"
version = "0.1.0"
description = "Autonomous sports card trading agent with eBay, CardLadder, and PSA integration"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
    "httpx>=0.25",
    "sqlalchemy>=2.0",
    "alembic>=1.12",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "anthropic>=0.39",
    "openpyxl>=3.1",
    "rich>=13.0",
    "python-dotenv>=1.0",
    "apscheduler>=3.10",
    "twilio>=9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
]

[project.scripts]
cardagent = "src.cli:cli"

[tool.setuptools.packages.find]
include = ["src*", "config*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
